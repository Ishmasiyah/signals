<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishmasiyah Signal Bot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; color: #e0e0e0; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; color: #00e5ff; letter-spacing: 3px; }
  .header p { color: #607d8b; font-size: 11px; letter-spacing: 2px; margin-top: 4px; }
  .card { background: #0d1b2a; border: 1px solid #1a3a5c; border-radius: 12px; padding: 14px; width: 100%; max-width: 480px; margin-bottom: 12px; }
  .card-title { color: #607d8b; font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; }
  .pair-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pair-btn { background: #0a0e1a; border: 1px solid #1a3a5c; color: #607d8b; padding: 8px 4px; border-radius: 8px; font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
  .pair-btn.active { background: #00e5ff; color: #000; border-color: #00e5ff; }
  .pair-btn .pair-icon { font-size: 14px; display: block; margin-bottom: 2px; }
  .capital-input { width: 100%; background: #0a0e1a; border: 1px solid #1a3a5c; color: #00e5ff; padding: 10px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 20px; text-align: center; }
  .capital-label { color: #607d8b; font-size: 11px; text-align: center; margin-top: 6px; }
  .price-row { display: flex; justify-content: space-between; align-items: center; }
  .price-val { font-family: 'Share Tech Mono', monospace; font-size: 22px; color: #00e5ff; }
  .price-change { font-size: 13px; }
  .up { color: #00e676; } .down { color: #ff1744; }
  .signal-card { background: #0d1b2a; border-radius: 12px; padding: 14px; width: 100%; max-width: 480px; margin-bottom: 12px; border: 2px solid #1a3a5c; transition: border-color 0.3s; }
  .signal-card.buy { border-color: #00e676; } .signal-card.sell { border-color: #ff1744; } .signal-card.neutral { border-color: #ffc107; }
  .signal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .badge { padding: 6px 16px; border-radius: 20px; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .badge.buy { background: #00e676; color: #000; } .badge.sell { background: #ff1744; color: #fff; } .badge.neutral { background: #ffc107; color: #000; }
  .timer-box { background: #0a0e1a; border-radius: 8px; padding: 6px 12px; text-align: center; }
  .timer-label { font-size: 10px; color: #607d8b; letter-spacing: 1px; }
  .timer-val { font-family: 'Share Tech Mono', monospace; font-size: 16px; color: #ffc107; }
  .code-box { font-family: 'Share Tech Mono', monospace; font-size: 22px; color: #00e5ff; background: #0a0e1a; padding: 10px; border-radius: 8px; text-align: center; letter-spacing: 4px; margin-bottom: 10px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .stat-box { background: #0a0e1a; padding: 8px; border-radius: 8px; text-align: center; }
  .stat-label { font-size: 10px; color: #607d8b; letter-spacing: 1px; }
  .stat-val { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .stat-val.green { color: #00e676; } .stat-val.red { color: #ff1744; } .stat-val.blue { color: #00e5ff; } .stat-val.yellow { color: #ffc107; }
  .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .analysis { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #90a4ae; background: #0a0e1a; padding: 10px; border-radius: 8px; line-height: 1.8; margin-bottom: 10px; }
  .send-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0088cc, #00e5ff); color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; cursor: pointer; margin-top: 8px; }
  .auto-status { width: 100%; padding: 12px; background: #0a0e1a; border-radius: 10px; text-align: center; font-size: 12px; color: #00e676; font-family: 'Share Tech Mono', monospace; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #00e676; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #00e676; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .log-box { background: #0d1b2a; border: 1px solid #1a3a5c; border-radius: 12px; padding: 14px; width: 100%; max-width: 480px; max-height: 160px; overflow-y: auto; }
  .log-title { color: #607d8b; font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; }
  .log-entry { font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #0a0e1a; color: #607d8b; }
  .log-entry.s { color: #00e676; } .log-entry.e { color: #ff1744; } .log-entry.i { color: #00e5ff; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ ISHMASIYAH BOT</h1>
  <p>AUTO SIGNAL · 30 MIN CYCLE · MULTI-PAIR</p>
</div>

<div class="card">
  <div class="card-title">📊 SELECT PAIR</div>
  <div class="pair-grid">
    <button class="pair-btn active" onclick="selectPair('BTCUSDT')" id="btn-BTCUSDT"><span class="pair-icon">₿</span>BTC</button>
    <button class="pair-btn" onclick="selectPair('ETHUSDT')" id="btn-ETHUSDT"><span class="pair-icon">Ξ</span>ETH</button>
    <button class="pair-btn" onclick="selectPair('XAUUSD')" id="btn-XAUUSD"><span class="pair-icon">🥇</span>GOLD</button>
    <button class="pair-btn" onclick="selectPair('EURUSD')" id="btn-EURUSD"><span class="pair-icon">€</span>EUR</button>
    <button class="pair-btn" onclick="selectPair('GBPUSD')" id="btn-GBPUSD"><span class="pair-icon">£</span>GBP</button>
  </div>
</div>



<div class="card">
  <div class="card-title" id="priceLabel">📡 LIVE BTCUSDT</div>
  <div class="price-row">
    <div class="price-val" id="btcPrice">Loading...</div>
    <div class="price-change" id="priceChange">—</div>
  </div>
</div>

<div class="signal-card neutral" id="signalCard">
  <div class="signal-top">
    <span class="badge neutral" id="signalBadge">ANALYZING</span>
    <div class="timer-box">
      <div class="timer-label">EXPIRES IN</div>
      <div class="timer-val" id="timerVal">--</div>
    </div>
  </div>
  <div class="card-title" id="pairLabel" style="text-align:center; font-size:14px; color:#00e5ff; margin-bottom:10px;">—</div>
  <div class="grid4">
    <div class="stat-box"><div class="stat-label">DIRECTION</div><div class="stat-val yellow" id="dirVal">—</div></div>
    <div class="stat-box"><div class="stat-label">CONFIDENCE</div><div class="stat-val blue" id="confVal">—</div></div>
    <div class="stat-box"><div class="stat-label">ENTRY/STOP</div><div class="stat-val green" id="lotVal">—</div></div>
    <div class="stat-box"><div class="stat-label">TARGET</div><div class="stat-val yellow" id="tpVal">—</div></div>
  </div>
  <div class="time-row">
    <div class="stat-box"><div class="stat-label">ENTRY TIME</div><div class="stat-val blue" id="entryTime">—</div></div>
    <div class="stat-box"><div class="stat-label">EXPIRY TIME</div><div class="stat-val red" id="expiryTime">—</div></div>
  </div>
  <div class="analysis" id="analysisBox">Initializing AI engine...</div>
  <div class="auto-status"><span class="dot"></span>AUTO SENDING TO TELEGRAM EVERY 30 MIN</div>
  <button class="send-btn" onclick="sendToTelegram()">📤 SEND NOW TO TELEGRAM</button>
</div>

<div class="log-box">
  <div class="log-title">SIGNAL LOG</div>
  <div id="logContainer"><div class="log-entry i">Bot initialized. Ready.</div></div>
</div>

<script>
const TELEGRAM_TOKEN = '8992436510:AAEg7fGlEWfjrT3XCqibv7bwtRre-70Aaq4';
const CHAT_ID = '8914507631';
const CYCLE_MS = 30 * 60 * 1000;

// Use Binance for ALL pairs (XAUUSDT, EURUSDT, GBPUSDT also available on Binance)
const PAIRS = {
  BTCUSDT: { name: 'BTC/USDT', symbol: 'BTCUSDT', decimals: 2, type: 'crypto', tradeType: 'binary' },
  ETHUSDT: { name: 'ETH/USDT', symbol: 'ETHUSDT', decimals: 2, type: 'crypto', tradeType: 'binary' },
  XAUUSD:  { name: 'XAU/USD (GOLD)', symbol: 'PAXGUSDT', decimals: 2, type: 'crypto', tradeType: 'spot', pip: 0.1 },
  EURUSD:  { name: 'EUR/USD', symbol: 'EURUSDT', decimals: 5, type: 'crypto', tradeType: 'spot', pip: 0.0001 },
  GBPUSD:  { name: 'GBP/USD', symbol: 'GBPUSDT', decimals: 5, type: 'crypto', tradeType: 'spot', pip: 0.0001 },
};

let currentPair = 'BTCUSDT';
let currentSignal = null;
let lastPrice = null;
let priceHistories = { BTCUSDT:[], ETHUSDT:[], XAUUSD:[], EURUSD:[], GBPUSD:[] };
let countdownInterval = null;
let capital = 130;

function addLog(msg, type) {
  type = type || '';
  var c = document.getElementById('logContainer');
  var e = document.createElement('div');
  e.className = 'log-entry ' + type;
  e.textContent = msg;
  c.insertBefore(e, c.firstChild);
  if (c.children.length > 30) c.removeChild(c.lastChild);
}

function selectPair(pair) {
  currentPair = pair;
  lastPrice = null;
  document.querySelectorAll('.pair-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btn-' + pair).classList.add('active');
  document.getElementById('priceLabel').textContent = '📡 LIVE ' + PAIRS[pair].name;
  document.getElementById('btcPrice').textContent = 'Loading...';
  document.getElementById('priceChange').textContent = '—';
  addLog('Switched to ' + PAIRS[pair].name, 'i');
  generateAndSendSignal();
}

function generateCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 7; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function getTimeStr(date) { return date.toTimeString().slice(0,5); }

function startCountdown() {
  clearInterval(countdownInterval);
  var expiry = Date.now() + CYCLE_MS;
  countdownInterval = setInterval(function() {
    var rem = expiry - Date.now();
    if (rem <= 0) { document.getElementById('timerVal').textContent = 'EXPIRED'; clearInterval(countdownInterval); }
    else {
      var mins = Math.floor(rem / 60000);
      var secs = Math.ceil((rem % 60000) / 1000);
      document.getElementById('timerVal').textContent = mins + 'm ' + secs + 's';
    }
  }, 1000);
}

async function fetchPrice(pair) {
  try {
    var p = PAIRS[pair];
    var res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=' + p.symbol);
    var data = await res.json();
    if (data.price) return parseFloat(data.price);
    // fallback for GBP if GBPUSDT doesn't exist
    if (pair === 'GBPUSD') {
      var res2 = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=GBPUSDC');
      var data2 = await res2.json();
      if (data2.price) return parseFloat(data2.price);
    }
    // fallback chain for Gold
    if (pair === 'XAUUSD') {
      var goldSymbols = ['PAXGBUSD', 'XAUTUSDT', 'PAXGUSDC'];
      for (var i = 0; i < goldSymbols.length; i++) {
        try {
          var resG = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=' + goldSymbols[i]);
          var dataG = await resG.json();
          if (dataG.price) return parseFloat(dataG.price);
        } catch(eg) {}
      }
    }
    return null;
  } catch(e) { return null; }
}

function analyzeMarket(prices) {
  if (prices.length < 1) return null;
  var latest = prices[prices.length - 1];
  var prev = prices.length >= 2 ? prices[prices.length - 2] : latest;
  var change = ((latest - prev) / prev) * 100;
  var shortMA = prices.slice(-Math.min(3,prices.length)).reduce(function(a,b){return a+b;},0)/Math.min(3,prices.length);
  var longMA = prices.slice(-Math.min(prices.length,10)).reduce(function(a,b){return a+b;},0)/Math.min(prices.length,10);

  var direction, confidence, trend, momentum;
  if (shortMA > longMA && change > 0) {
    direction='UP'; confidence=Math.min(95,62+Math.abs(change)*20); trend='BULLISH'; momentum='STRONG ↑';
  } else if (shortMA < longMA && change < 0) {
    direction='DOWN'; confidence=Math.min(95,62+Math.abs(change)*20); trend='BEARISH'; momentum='STRONG ↓';
  } else if (change > 0.01) {
    direction='UP'; confidence=Math.min(78,55+Math.abs(change)*15); trend='BULLISH'; momentum='MODERATE ↑';
  } else if (change < -0.01) {
    direction='DOWN'; confidence=Math.min(78,55+Math.abs(change)*15); trend='BEARISH'; momentum='MODERATE ↓';
  } else {
    direction='HOLD'; confidence=45; trend='SIDEWAYS'; momentum='WEAK →';
  }
  return { direction:direction, confidence:parseFloat(confidence).toFixed(0), trend:trend, momentum:momentum, change:parseFloat(change).toFixed(4), price:latest };
}

async function generateAndSendSignal() {
  var pair = currentPair;
  var price = await fetchPrice(pair);
  if (!price) { addLog('Failed to fetch ' + PAIRS[pair].name, 'e'); return; }

  var dec = PAIRS[pair].decimals;
  document.getElementById('btcPrice').textContent = '$' + price.toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});

  if (lastPrice) {
    var diff = price - lastPrice;
    var pct = ((diff/lastPrice)*100).toFixed(4);
    document.getElementById('priceChange').textContent = (diff >= 0 ? '▲ +' : '▼ ') + pct + '%';
    document.getElementById('priceChange').className = 'price-change ' + (diff >= 0 ? 'up' : 'down');
  }
  lastPrice = price;

  priceHistories[pair].push(price);
  if (priceHistories[pair].length > 20) priceHistories[pair].shift();

  var analysis = analyzeMarket(priceHistories[pair]);
  if (!analysis) return;

  var now = new Date();
  var expiry = new Date(now.getTime() + CYCLE_MS);
  var p = PAIRS[pair];

  currentSignal = { direction:analysis.direction, confidence:analysis.confidence, trend:analysis.trend, momentum:analysis.momentum, change:analysis.change, price:price, entryTime:getTimeStr(now), expiryTime:getTimeStr(expiry), pair:p.name, tradeType:p.tradeType, decimals:p.decimals };

  if (p.tradeType === 'spot' && analysis.direction !== 'HOLD') {
    var pip = p.pip;
    var slPips = 20;
    var tpPips = 40;
    var spreadPips = pair === 'XAUUSD' ? 3 : 1.5;
    if (analysis.direction === 'UP') {
      currentSignal.entryPrice = price;
      currentSignal.stopLoss = price - (slPips * pip);
      currentSignal.takeProfit = price + (tpPips * pip);
    } else {
      currentSignal.entryPrice = price;
      currentSignal.stopLoss = price + (slPips * pip);
      currentSignal.takeProfit = price - (tpPips * pip);
    }
    currentSignal.slPips = slPips;
    currentSignal.tpPips = tpPips;
    currentSignal.spreadPips = spreadPips;
  }

  var cls = analysis.direction==='UP' ? 'buy' : analysis.direction==='DOWN' ? 'sell' : 'neutral';
  document.getElementById('signalCard').className = 'signal-card ' + cls;
  var badge = document.getElementById('signalBadge');
  badge.className = 'badge ' + cls;
  badge.textContent = analysis.direction==='UP' ? '🟢 UP' : analysis.direction==='DOWN' ? '🔴 DOWN' : '🟡 HOLD';
  document.getElementById('pairLabel').textContent = p.name + ' · ' + (p.tradeType === 'binary' ? 'BINARY' : 'SPOT/CFD');
  var dv = document.getElementById('dirVal');
  dv.className = 'stat-val ' + (analysis.direction==='UP'?'green':analysis.direction==='DOWN'?'red':'yellow');
  dv.textContent = analysis.direction;
  document.getElementById('confVal').textContent = analysis.confidence + '%';
  if (p.tradeType === 'binary') {
    document.getElementById('lotVal').textContent = 'Entry: ' + getTimeStr(now);
    document.getElementById('tpVal').textContent = 'Exit: ' + getTimeStr(expiry);
  } else if (analysis.direction !== 'HOLD') {
    document.getElementById('lotVal').textContent = currentSignal.entryPrice.toFixed(p.decimals) + ' / ' + currentSignal.stopLoss.toFixed(p.decimals);
    document.getElementById('tpVal').textContent = currentSignal.takeProfit.toFixed(p.decimals);
  } else {
    document.getElementById('lotVal').textContent = '—';
    document.getElementById('tpVal').textContent = '—';
  }
  document.getElementById('entryTime').textContent = getTimeStr(now);
  document.getElementById('expiryTime').textContent = getTimeStr(expiry);
  document.getElementById('analysisBox').textContent =
    '> PAIR    : ' + p.name + '\n' +
    '> PRICE   : ' + price.toLocaleString(undefined,{minimumFractionDigits:p.decimals}) + '\n' +
    '> CHANGE  : ' + analysis.change + '%\n' +
    '> TREND   : ' + analysis.trend + '\n' +
    '> MOMENTUM: ' + analysis.momentum + '\n' +
    '> MODE    : ' + (p.tradeType === 'binary' ? 'BINARY (entry/expiry)' : 'SPOT (entry/SL/TP)') + '\n' +
    '> CYCLE   : 30 MINUTES';

  startCountdown();
  addLog('[' + getTimeStr(now) + '] ' + p.name + ' → ' + analysis.direction + ' | ' + analysis.confidence + '%',
    analysis.direction==='UP'?'s':analysis.direction==='DOWN'?'e':'i');

  await sendToTelegram();
}

async function sendToTelegram() {
  if (!currentSignal) { addLog('No signal yet', 'e'); return; }
  var s = currentSignal;
  var emoji = s.direction==='UP' ? '🟢' : s.direction==='DOWN' ? '🔴' : '🟡';
  var arrow = s.direction==='UP' ? '📈' : s.direction==='DOWN' ? '📉' : '➡️';
  var dec = s.decimals;

  var msg =
    '⚡ *ISHMASIYAH SIGNAL BOT*\n' +
    '━━━━━━━━━━━━━━━━━━\n' +
    emoji + ' *SIGNAL: ' + s.direction + '* ' + arrow + '\n' +
    '💱 *PAIR:* ' + s.pair + '\n' +
    '🎯 *CONFIDENCE:* ' + s.confidence + '%\n' +
    '📈 *TREND:* ' + s.trend + '\n' +
    '⚡ *MOMENTUM:* ' + s.momentum + '\n' +
    '━━━━━━━━━━━━━━━━━━\n';

  if (s.tradeType === 'binary') {
    msg +=
      '💵 *PRICE:* $' + s.price.toLocaleString() + '\n' +
      '⏰ *ENTRY:* ' + s.entryTime + '\n' +
      '⌛ *EXPIRY:* ' + s.expiryTime + ' (30 min)\n';
  } else if (s.direction !== 'HOLD') {
    msg +=
      '📍 *ENTRY PRICE:* ' + s.entryPrice.toFixed(dec) + '\n' +
      '🛑 *STOP LOSS:* ' + s.stopLoss.toFixed(dec) + ' (' + s.slPips + ' pips)\n' +
      '🎯 *TAKE PROFIT:* ' + s.takeProfit.toFixed(dec) + ' (' + s.tpPips + ' pips)\n' +
      '📏 *SPREAD:* ~' + s.spreadPips + ' pips\n' +
      '⚖️ *RISK/REWARD:* 1:' + (s.tpPips / s.slPips).toFixed(1) + '\n';
  } else {
    msg += '⏸ *No clear setup right now — wait for next signal*\n';
  }

  msg += '━━━━━━━━━━━━━━━━━━\n_Powered by Ishmasiyah AI_';

  try {
    var res = await fetch('https://api.telegram.org/bot' + TELEGRAM_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown'})
    });
    var data = await res.json();
    if (data.ok) addLog('Signal sent to Telegram ✓', 's');
    else addLog('Telegram error: ' + data.description, 'e');
  } catch(e) { addLog('Send failed: ' + e.message, 'e'); }
}

// Price refresh every 30 seconds
setInterval(async function() {
  var price = await fetchPrice(currentPair);
  if (!price) return;
  var dec = PAIRS[currentPair].decimals;
  document.getElementById('btcPrice').textContent = '$' + price.toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  if (lastPrice) {
    var diff = price - lastPrice;
    var pct = ((diff/lastPrice)*100).toFixed(4);
    document.getElementById('priceChange').textContent = (diff >= 0 ? '▲ +' : '▼ ') + pct + '%';
    document.getElementById('priceChange').className = 'price-change ' + (diff >= 0 ? 'up' : 'down');
  }
  priceHistories[currentPair].push(price);
  if (priceHistories[currentPair].length > 20) priceHistories[currentPair].shift();
  lastPrice = price;
}, 30000);

// Auto signal every 30 minutes
setInterval(generateAndSendSignal, CYCLE_MS);

// Start immediately
generateAndSendSignal();
</script>
</body>
</html>
